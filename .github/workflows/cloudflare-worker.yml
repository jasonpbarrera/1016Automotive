name: Cloudflare Workers CI/CD

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare Workers
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Sync Static SEO & Manifest
        run: python3 scripts/sync-client-config.py

      - name: Publish Blazor Client
        run: dotnet publish Client/SmallBusinessSite.Client.csproj -c Release -o publish_output -p:ContinuousIntegrationBuild=true

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Submit URLs to IndexNow
        run: |
          python3 -c '
          import json, urllib.request
          domain = "https://www.1016auto.com"
          host = "www.1016auto.com"
          urls = [
              f"{domain}/",
              f"{domain}/services",
              f"{domain}/gallery",
              f"{domain}/socials",
              f"{domain}/about",
              f"{domain}/contact"
          ]
          payload = json.dumps({
              "host": host,
              "key": "e3d29a08c8474f63bb9b7d8b5c9632f1",
              "keyLocation": f"{domain}/e3d29a08c8474f63bb9b7d8b5c9632f1.txt",
              "urlList": urls
          }).encode("utf-8")
          for ep in ["https://api.indexnow.org/indexnow", "https://www.bing.com/indexnow"]:
              try:
                  req = urllib.request.Request(ep, data=payload, headers={"Content-Type": "application/json; charset=utf-8", "User-Agent": "JBDigitalCI/1.0"})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      print(f"Submitted to {ep}: {resp.status}")
              except Exception as e:
                  print(f"Crawler notice ({ep}): {e}")
          '
